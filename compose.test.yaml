# Test-only stack: never merge with compose.yaml or reuse developer volumes.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: gethookd_test
      POSTGRES_PASSWORD: public-disposable-test-password
      POSTGRES_DB: gethookd_test
    labels:
      io.gethookd.test-run: ${GETHOOKD_TEST_RUN_ID:?Test lifecycle must supply its ownership ID}
    ports:
      - "127.0.0.1::5432"
    volumes:
      - test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 1s
      timeout: 2s
      retries: 30

volumes:
  test_data:
    labels:
      io.gethookd.test-run: ${GETHOOKD_TEST_RUN_ID:?Test lifecycle must supply its ownership ID}

networks:
  default:
    labels:
      io.gethookd.test-run: ${GETHOOKD_TEST_RUN_ID:?Test lifecycle must supply its ownership ID}
