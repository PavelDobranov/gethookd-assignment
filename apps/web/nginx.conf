server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Preserve /api paths and API error statuses; never serve SPA HTML for them.
  location = /api {
    proxy_pass http://api:3000;
  }
  location /api/ {
    proxy_pass http://api:3000;
  }
  location / {
    try_files $uri $uri/ /index.html;
  }
}
