openapi: 3.1.1
info:
  title: GetHookd v1 REST API
  version: 1.0.0
  description: |
    Stored API keys authenticate every request, including continuations; portal JWTs
    and query-string api_key credentials do not authenticate v1. Authentication
    precedes resource validation. All v1 successes and errors use Cache-Control: no-store.
    Unknown v1 routes and unsupported methods return NOT_FOUND (404) in the same
    error envelope. Malformed path encodings return VALIDATION_ERROR (422).
    Rate limiting and 429/Retry-After are future M4 work, not current responses.
security:
  - BearerApiKey: []
paths:
  /api/v1/ads:
    get:
      operationId: searchAds
      summary: Search ads with strict filters and opaque forward pagination
      description: |
        Only the listed, case-sensitive query names are accepted. Unknown names
        (including page, per_page, api_key, niche[] and niche[x]) and repeated
        scalar parameters return 422. Only niche may repeat. Validate all supplied
        values before normalizing; do not silently fix case, display names or typos.
        Filters combine with AND; niches combine with OR; q searches headline OR body.
        sort=impressions requires one brand_id; otherwise 422 with instructions to
        add brand_id or use newest. Parameter schemas cannot express this cross-field rule.

        newest orders start_date DESC, then text id ASC using bytewise C collation.
        impressions orders impression_rank ASC NULLS LAST, then the same id order.
        Rank 1 is highest within one brand; gaps remain and null means unknown, not
        zero. Ranks cannot establish impression magnitudes or compare brands.

        Page one establishes a committed database visibility boundary B. Both sorts
        exclude ALL inserts committed after B, including backdated inserts and
        inserts already in flight at B. A forward walk has no duplicates and returns
        each initially matching ad that continues to match exactly once. Each page
        reads live status/end_date coherently: deactivated ads may leave active
        searches, but remain in unfiltered searches. Previously existing ads newly
        matching an inactive filter may appear ahead of the current position; their
        inclusion is not guaranteed. A fresh search is needed for complete newly
        eligible results. Guarantees assume the supported single-ingest mutation
        model (insert/deactivate, immutable existing ordering keys), not arbitrary
        edits, deletes, reactivation or multiple ingest workers.

        A cursor binds normalized original filters/sort, boundary and position.
        Send only cursor plus optional limit, or repeat query-defining parameters
        that normalize to the original values. Omitted filters inherit originals;
        the complete supplied niche set must match. Changed meaning returns
        CURSOR_QUERY_MISMATCH. Limit may change and defaults to 20 on every request.
        Cursors expire exactly 30 minutes after page-one start, without renewal.
        They are reusable reads, not destructive state advances; replay may differ
        with live updates. No total/count or historical mutable-field snapshot is
        promised. Exhaustion does not subscribe to later status changes.
        Ordinary restarts preserve tokens with unchanged secret/database history;
        secret rotation invalidates them. Rotate CURSOR_SECRET after database
        restore/replacement and start fresh searches. Oversize server-generated
        tokens fail safely with 500 rather than weakening the boundary.
      parameters:
        - name: q
          in: query
          description: |
            Trim outer whitespace, preserve internal whitespace/case. Empty or
            whitespace-only means no keyword restriction. At most 500 Unicode code
            points AFTER trimming; the schema describes the normalized value.
            Case-insensitive literal substring of headline OR body_text; %, _ and
            backslash are literal, never patterns. NUL is invalid.
          schema: { type: string, maxLength: 500, pattern: '^[^\u0000]*$', default: '' }
        - name: niche
          in: query
          style: form
          explode: true
          description: |
            Repeated keys, e.g. niche=skincare&niche=haircare. Exact canonical slugs
            only; empty elements, display names, case variants, comma-separated and
            bracket syntax are invalid. Normalize by deduplicating and lexical sorting.
            Omitted means no niche restriction (empty array).
          schema:
            type: array
            items: { $ref: '#/components/schemas/NicheSlug' }
            default: []
        - name: format
          in: query
          description: Exact canonical format; omitted means unrestricted, empty is invalid.
          schema: { $ref: '#/components/schemas/AdFormat' }
        - name: status
          in: query
          description: Exact canonical status; omitted means unrestricted, empty is invalid.
          schema: { $ref: '#/components/schemas/AdStatus' }
        - name: started_after
          in: query
          description: Exclusive start_date boundary; real Gregorian YYYY-MM-DD, years 0001–9999. Future dates are valid.
          schema: { $ref: '#/components/schemas/CalendarDate' }
        - name: brand_id
          in: query
          description: |
            Positive base-10 integer 1–2147483647. Digits only, no sign, whitespace,
            fraction or exponent; leading zeros normalize numerically. Required for
            impressions. A valid nonexistent brand matches no ads.
          schema: { type: integer, minimum: 1, maximum: 2147483647 }
        - name: sort
          in: query
          description: Exact value; impressions requires brand_id (cross-field rule above).
          schema: { $ref: '#/components/schemas/Sort' }
        - name: limit
          in: query
          description: Positive base-10 digits only; leading zeros allowed. Never clamped; may change during a walk.
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: cursor
          in: query
          description: |
            Opaque, authenticated, versioned token from next_cursor. Contains no API
            key/JWT and never substitutes for auth. Empty, malformed, tampered,
            unsupported or secret-invalidated tokens return INVALID_CURSOR; at or
            after fixed expiry return CURSOR_EXPIRED. Start fresh rather than retry
            the same expired token. Syntax alone does not prove integrity or validity.
          schema: { type: string, minLength: 1, maxLength: 4096, pattern: '^[A-Za-z0-9_.-]+$' }
      responses:
        '200':
          description: Matching summaries; empty/final pages have next_cursor null, including the final nonempty page.
          headers:
            Cache-Control: { schema: { const: no-store }, description: Never cache protected data. }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/SearchInvalid' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/ads/{id}:
    get:
      operationId: getAd
      summary: Retrieve full current detail for an exact opaque ad ID
      description: |
        No query parameters accepted. URL-encode the nonempty opaque text ID; it is
        not an integer or seed-specific pattern. NUL/malformed encoding returns 422.
        Missing ID returns AD_NOT_FOUND. Detail is a current read, independent of cursors.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, minLength: 1, pattern: '^[^\u0000]*$' }
      responses:
        '200':
          description: Full ad detail; no database, user, API-key or snapshot internals.
          headers:
            Cache-Control: { schema: { const: no-store } }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AdDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/AdNotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/niches:
    get:
      operationId: listNiches
      summary: Discover canonical niche slugs and display names
      description: No query parameters. Returns exactly the 12 catalog entries in catalog order, without pagination, counts or seed keywords.
      responses:
        '200':
          description: Existing niche catalog in the order shown by NicheSlug.
          headers:
            Cache-Control: { schema: { const: no-store } }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    type: array
                    minItems: 12
                    maxItems: 12
                    items:
                      type: object
                      additionalProperties: false
                      required: [slug, name]
                      properties:
                        slug: { $ref: '#/components/schemas/NicheSlug' }
                        name: { type: string, minLength: 1 }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
components:
  securitySchemes:
    BearerApiKey: { type: http, scheme: bearer }
  schemas:
    NicheSlug:
      type: string
      enum: [skincare, haircare, supplements, fitness, pet-supplies, home-decor, kitchen, apparel, jewelry, baby-kids, outdoor, tech-accessories]
    AdFormat: { type: string, enum: [image, video, carousel] }
    AdStatus: { type: string, enum: [active, inactive] }
    Sort: { type: string, enum: [newest, impressions], default: newest }
    CalendarDate:
      type: string
      format: date
      pattern: '^(?!0000)[0-9]{4}-[0-9]{2}-[0-9]{2}$'
    UtcTimestamp:
      type: string
      format: date-time
      pattern: 'Z$'
    AdSummary:
      type: object
      additionalProperties: false
      required: [id, brand_id, brand_name, headline, niche, format, status, start_date, days_active, impression_rank]
      properties:
        id: { type: string, minLength: 1 }
        brand_id: { type: integer, minimum: 1, maximum: 2147483647 }
        brand_name: { type: string }
        headline: { type: string, description: Full stored headline; not silently truncated. }
        niche: { $ref: '#/components/schemas/NicheSlug' }
        format: { $ref: '#/components/schemas/AdFormat' }
        status: { $ref: '#/components/schemas/AdStatus' }
        start_date: { $ref: '#/components/schemas/CalendarDate' }
        days_active:
          type: integer
          description: |
            Derived whole UTC calendar days: active uses UTC today minus start_date;
            inactive uses end_date minus start_date. One coherent time per response,
            not stored or frozen at B; may change across UTC midnight. Future starts
            can produce negative values.
        impression_rank: { type: [integer, 'null'], minimum: 1, description: Brand-local rank; null is unknown. }
    AdDetail:
      type: object
      additionalProperties: false
      required: [id, brand_id, brand_name, headline, niche, format, status, start_date, days_active, impression_rank, body_text, end_date, countries, discovered_at]
      properties:
        id: { type: string, minLength: 1 }
        brand_id: { type: integer, minimum: 1, maximum: 2147483647 }
        brand_name: { type: string }
        headline: { type: string }
        niche: { $ref: '#/components/schemas/NicheSlug' }
        format: { $ref: '#/components/schemas/AdFormat' }
        status: { $ref: '#/components/schemas/AdStatus' }
        start_date: { $ref: '#/components/schemas/CalendarDate' }
        days_active: { type: integer, description: Same live UTC derivation as AdSummary. }
        impression_rank: { type: [integer, 'null'], minimum: 1 }
        body_text: { type: string }
        end_date:
          anyOf:
            - { $ref: '#/components/schemas/CalendarDate' }
            - { type: 'null' }
        countries:
          type: array
          uniqueItems: true
          items: { type: string, pattern: '^[A-Z]{2}$', description: Assigned ISO 3166-1 alpha-2 code. }
        discovered_at: { $ref: '#/components/schemas/UtcTimestamp' }
    AppliedFilters:
      type: object
      additionalProperties: false
      required: [q, niche, format, status, started_after, brand_id]
      properties:
        q: { type: string, maxLength: 500 }
        niche:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/NicheSlug' }
          description: Lexically sorted canonical slugs; absent is [].
        format:
          anyOf:
            - { $ref: '#/components/schemas/AdFormat' }
            - { type: 'null' }
        status:
          anyOf:
            - { $ref: '#/components/schemas/AdStatus' }
            - { type: 'null' }
        started_after:
          anyOf:
            - { $ref: '#/components/schemas/CalendarDate' }
            - { type: 'null' }
        brand_id: { type: [integer, 'null'], minimum: 1, maximum: 2147483647 }
    SearchResponse:
      type: object
      additionalProperties: false
      required: [data, applied_filters, sort, limit, next_cursor, cursor_expires_at]
      properties:
        data:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/AdSummary' }
        applied_filters:
          $ref: '#/components/schemas/AppliedFilters'
          description: Effective normalized ORIGINAL filters on every page, including empty results and continuations. Absent scalars are null, keyword is empty string, niches are [].
        sort: { $ref: '#/components/schemas/Sort' }
        limit: { type: integer, minimum: 1, maximum: 100 }
        next_cursor:
          type: [string, 'null']
          minLength: 1
          maxLength: 4096
          pattern: '^[A-Za-z0-9_.-]+$'
        cursor_expires_at:
          $ref: '#/components/schemas/UtcTimestamp'
          description: Fixed first-page expiry even on final/empty pages; never renewed.
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, next_action, retryable, details]
          properties:
            code:
              type: string
              enum: [UNAUTHENTICATED, AD_NOT_FOUND, NOT_FOUND, VALIDATION_ERROR, INVALID_CURSOR, CURSOR_EXPIRED, CURSOR_QUERY_MISMATCH, INTERNAL_ERROR]
            message: { type: string, minLength: 1 }
            next_action: { type: string, minLength: 1 }
            retryable: { type: boolean, description: Same intended read might succeed without correcting client input; not a guarantee. }
            details:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [parameter, reason, allowed_values, suggestion]
                properties:
                  parameter: { type: string }
                  reason: { type: string }
                  allowed_values: { type: array, items: { type: string } }
                  suggestion: { type: [string, 'null'] }
          description: Safe public corrections only; never credentials, cursor contents, SQL, stack traces or internal diagnostics. Details is [] when inapplicable; wording is not a machine contract.
    Error401:
      allOf:
        - { $ref: '#/components/schemas/ErrorEnvelope' }
        - type: object
          properties:
            error:
              type: object
              properties:
                code: { const: UNAUTHENTICATED }
                retryable: { const: false }
    Error404:
      allOf:
        - { $ref: '#/components/schemas/ErrorEnvelope' }
        - type: object
          properties:
            error:
              type: object
              properties:
                code: { enum: [NOT_FOUND, AD_NOT_FOUND] }
                retryable: { const: false }
    Error422:
      allOf:
        - { $ref: '#/components/schemas/ErrorEnvelope' }
        - type: object
          properties:
            error:
              type: object
              properties:
                code: { enum: [VALIDATION_ERROR, INVALID_CURSOR, CURSOR_EXPIRED, CURSOR_QUERY_MISMATCH] }
                retryable: { const: false }
    Error500:
      allOf:
        - { $ref: '#/components/schemas/ErrorEnvelope' }
        - type: object
          properties:
            error:
              type: object
              properties:
                code: { const: INTERNAL_ERROR }
                retryable: { const: true }
  responses:
    Unauthenticated:
      description: Missing, malformed or invalid Bearer API key. Supply a valid stored key, never a portal JWT or query-string credential.
      headers:
        Cache-Control: { schema: { const: no-store } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error401' }
    NotFound:
      description: Unknown v1 route or unsupported method; use a documented GET route.
      headers:
        Cache-Control: { schema: { const: no-store } }
      content:
        application/json:
          schema:
            allOf:
              - { $ref: '#/components/schemas/Error404' }
              - type: object
                properties:
                  error: { type: object, properties: { code: { const: NOT_FOUND } } }
    AdNotFound:
      description: AD_NOT_FOUND for a missing exact ID; NOT_FOUND for unsupported routes/methods. Check IDs from search results.
      headers:
        Cache-Control: { schema: { const: no-store } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error404' }
    ValidationError:
      description: Invalid query/path. Correct names/values; details contain allowed choices and deterministic advisory suggestions, never automatic corrections.
      headers:
        Cache-Control: { schema: { const: no-store } }
      content:
        application/json:
          schema:
            allOf:
              - { $ref: '#/components/schemas/Error422' }
              - type: object
                properties:
                  error: { type: object, properties: { code: { const: VALIDATION_ERROR } } }
    SearchInvalid:
      description: |
        VALIDATION_ERROR for invalid requests (including missing brand for impressions).
        INVALID_CURSOR: use an unmodified supported token or start fresh.
        CURSOR_EXPIRED: start fresh; retrying the same token cannot help.
        CURSOR_QUERY_MISMATCH: retain original query meaning or start fresh.
      headers:
        Cache-Control: { schema: { const: no-store } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error422' }
    InternalError:
      description: Unexpected/database failure; retry after a short delay, not in a tight loop. Never translated into 401 or empty 200.
      headers:
        Cache-Control: { schema: { const: no-store } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error500' }
